<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4F5438">
<title>Crochet Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%234F5438'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23E8E1D4' stroke-width='6'/%3E%3Cpath d='M32 8 L32 56' stroke='%23E8E1D4' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#E8E1D4;--bg2:#F0EBE1;--card:#F7F3EB;--ink:#2A2621;--muted:#6F6A57;--line:#CFCBB4;
  --accent:#4F5438;--accent-ink:#F1EFE2;--accent2:#4E6172;--soft:#DBDCC7;--danger:#A8352F;--ok:#4F5438;
  --olive:#4F5438;--denim:#4E6172;--sienna:#A85535;--brass:#A8873F;--link:#45596B;--focus:rgba(78,97,114,.32);--scrim:rgba(25,22,20,.5);
  --radius:12px;--shadow:0 1px 3px rgba(60,40,20,.09),0 4px 14px rgba(60,40,20,.07);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#191614;--bg2:#211D1A;--card:#2A2621;--ink:#E8E1D4;--muted:#928D78;--line:#3B3A2E;
  --accent:#7C8259;--accent-ink:#171914;--accent2:#8AA0B0;--soft:#302F24;--danger:#DB7A66;--ok:#9AA678;
  --olive:#8E9666;--denim:#8AA0B0;--sienna:#C2673D;--brass:#BE9A4A;--link:#9FB6C6;--focus:rgba(138,160,176,.34);--scrim:rgba(10,8,7,.6);
  --shadow:0 1px 3px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
a:hover{color:var(--accent)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:1.25rem}h3{font-size:1.05rem}
header.top{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
header.top .logo{width:28px;height:28px;border-radius:50%;background:var(--olive);display:grid;place-items:center;flex:none}
header.top .logo i{width:14px;height:14px;border:3px solid var(--bg2);border-radius:50%}
header.top h1{font-size:1.1rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:999px}
nav.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:999px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
main{max-width:980px;margin:0 auto;padding:16px 14px calc(90px + var(--safe-b))}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar h2{flex:1}
.toolbar input[type=search]{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card.click{cursor:pointer;transition:transform .08s}
.card.click:active{transform:scale(.99)}
.card .title{font-weight:650;color:var(--olive);margin-bottom:2px;display:flex;justify-content:space-between;gap:8px;align-items:start}
.card .sub{color:var(--muted);font-size:.9rem}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--soft);font-size:.78rem;color:var(--muted);white-space:nowrap}
.pill.active{background:#DCE0CD;color:#3D4229}.pill.finished{background:#D7DFE6;color:#3F5361}.pill.planning{background:var(--soft)}.pill.frogged{background:#F0DACF;color:#8A3F22}.pill.hibernating{background:#EDE2C4;color:#6C5520}
@media (prefers-color-scheme:dark){.pill.active{background:#333823;color:#BCC69C}.pill.finished{background:#2B3740;color:#A9C0CE}.pill.frogged{background:#43261B;color:#E3A183}.pill.hibernating{background:#3C3318;color:#D9BE72}}
button.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn.danger{color:var(--danger)}
button.btn.small{padding:5px 10px;font-size:.88rem}
button.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px var(--focus)}
textarea{min-height:100px;resize:vertical}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:40px 12px;border:1px dashed var(--line);border-radius:var(--radius)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
/* modal */
.modal-bg{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
@media(min-width:640px){.modal{border-radius:18px}}
.modal h2{margin-bottom:12px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.modal .actions .spacer{flex:1}
/* detail */
.detail-head{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.detail-head h2{flex:1}
.section{margin-top:18px}
.section h3{margin-bottom:8px;display:flex;align-items:center;gap:8px;color:var(--olive)}
.section h3 .cnt{color:var(--muted);font-weight:400;font-size:.9rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.93rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
/* counter */
.counter{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:720px){.counter{grid-template-columns:1.2fr 1fr}}
.count-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);text-align:center}
.count-card .lbl{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.count-card .num{font-size:5rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.count-card .num small{font-size:1.4rem;color:var(--muted);font-weight:500}
.count-card .of{color:var(--muted)}
.count-card .bigbtns{display:flex;gap:10px;margin-top:10px}
.count-card .bigbtns button{flex:1;font-size:2rem;padding:18px 0;border-radius:14px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.count-card .bigbtns button.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:2}
.count-card.secondary .bigbtns button.plus{background:var(--denim);border-color:var(--denim);color:var(--accent-ink)}
.count-card .mini{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.count-card.secondary .num{font-size:3.2rem}
.instr{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:10px;text-align:left;font-size:1.05rem}
.instr .n{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.instr.next{opacity:.7;font-size:.95rem}
.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--denim)}
.rowlist{max-height:50vh;overflow:auto;position:relative;border:1px solid var(--line);border-radius:12px}
.rowlist div{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px}
.rowlist div:last-child{border-bottom:0}
.rowlist div.cur{background:var(--soft);font-weight:600}
.rowlist div.done{color:var(--muted)}
.rowlist b{flex:none;min-width:52px;font-variant-numeric:tabular-nums}
/* attachments */
.att{display:flex;flex-wrap:wrap;gap:8px}
.att .a{width:110px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2);position:relative;cursor:pointer}
.att .a img{width:100%;height:80px;object-fit:cover;display:block}
.att .a .ph{height:80px;display:grid;place-items:center;font-size:1.8rem}
.att .a .nm{font-size:.72rem;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .a .x{position:absolute;top:3px;right:3px;background:rgba(25,22,20,.66);color:#E8E1D4;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.viewer{position:fixed;inset:0;background:#191614;z-index:60;display:flex;flex-direction:column}
.viewer .vbar{display:flex;gap:8px;align-items:center;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));color:#E8E1D4;background:#2A2621}
.viewer .vbar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer .vbody{flex:1;overflow:auto;display:grid;place-items:center}
.viewer img{max-width:100%;max-height:100%}
.viewer iframe,.viewer object{width:100%;height:100%;border:0;background:#E8E1D4}
/* scanner */
.scan video{width:100%;max-height:60vh;border-radius:12px;background:#191614}
.scan .hint{color:var(--muted);text-align:center;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:100;box-shadow:var(--shadow);max-width:90vw;font-size:.92rem;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat .card{text-align:center}.stat .card b{font-size:1.6rem;display:block;color:var(--denim)}
.yarnswatch{width:34px;height:34px;border-radius:50%;flex:none;border:2px solid var(--line);background:var(--soft);display:grid;place-items:center;overflow:hidden}
.yarnswatch img{width:100%;height:100%;object-fit:cover}
.flex{display:flex;gap:10px;align-items:center}
.muted{color:var(--muted)}.small{font-size:.86rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border-radius:999px;padding:3px 10px;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0;line-height:1}
.hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.notes{white-space:pre-wrap}
@media(max-width:600px){
  header.top nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-b));z-index:30;justify-content:space-around;background:var(--bg2);border:1px solid var(--line);box-shadow:0 4px 20px rgba(0,0,0,.15)}
  header.top nav.tabs button{flex:1;padding:9px 4px;font-size:.85rem}
  .count-card .num{font-size:4.2rem}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><i></i></div>
  <h1 id="title">Crochet Manager</h1>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ========== helpers ========== */

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const today = () => new Date().toISOString().slice(0, 10);

let settings = {};

  async put(rec) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("files", "readwrite"); t.objectStore("files").put(rec); t.oncomplete = () => res(rec.id); t.onerror = () => rej(t.error); }); },

  async del(id) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("files", "readwrite"); t.objectStore("files").delete(id); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async all() { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction("files").objectStore("files").getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); },

};
const urlCache = new Map();

  const u = URL.createObjectURL(rec.blob); urlCache.set(id, u); return u;
}
async function storeFile(file) {
  const id = uid();
  await idb.put({ id, name: file.name, type: file.type || guessType(file.name), size: file.size, blob: file, added: new Date().toISOString() });

}
function guessType(n) { n = n.toLowerCase(); return n.endsWith(".pdf") ? "application/pdf" : /\.(png|jpe?g|gif|webp|heic)$/.test(n) ? "image/" + n.split(".").pop() : "application/octet-stream"; }
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(b); });
function b64ToBlob(b64, type) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type }); }

/* ========== modal ========== */
function openModal(title, body, actions) {
  const bg = el("div", { class: "modal-bg", onclick: e => { if (e.target === bg) close(); } });

  const act = el("div", { class: "actions" });

}
function confirmDlg(msg, okLabel = "Delete") {

function field(label, input) { return el("label", { class: "f" }, el("span", null, label), input); }

const ROW_RE = /^\s*(?:\*\*|__)?\s*(rows?|rnds?|rounds?|r)\s*\.?\s*(\d+)\s*(?:\s*(?:-|–|—|to|through|thru)\s*(\d+))?\s*[:.)\-–—]?\s*(?:\*\*|__)?\s*[:.)\-–—]?\s*(.*)$/i;

  for (const raw of String(text || "").split(/\r?\n/)) {

    const m = line.match(ROW_RE);
    if (m) {

      const a = +m[2], b = m[3] ? +m[3] : a, text = m[4].trim();

}

function ravResultsList(container, items, renderRow) { container.replaceChildren(); if (!items.length) container.append(el("div", { class: "muted", style: "padding:12px" }, "No results.")); for (const it of items) container.append(renderRow(it)); }
function ravSearchDlg(kind) {

      if (kind === "patterns") {
        const j = await rav("patterns/search.json", { query: q.value, craft: "crochet", page_size: 25, page, availability: opts.value, sort: q.value ? "best" : "popularity" });
        ravResultsList(list, j.patterns || [], p => el("div", { style: "align-items:center", onclick: () => ravImportPattern(p.id, m) },
          p.first_photo?.small_url ? el("img", { src: ravImg(p.first_photo.small_url), style: "width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none", alt: "" }) : el("span", { style: "width:52px;flex:none;text-align:center;font-size:1.6rem" }, "🧶"),
          el("span", { style: "flex:1;min-width:0" }, el("b", { style: "display:block;min-width:0" }, p.name), el("span", { class: "muted small" }, [p.designer?.name, p.free ? "free" : null, p.pattern_sources?.[0]?.name].filter(Boolean).join(" · "))),
          el("span", { class: "pill" }, "Import")));
        status.textContent = (j.paginator ? `${j.paginator.results || ""} results · page ${j.paginator.page}/${j.paginator.last_page}` : "") + " — tap a pattern to import it.";
        pager(j.paginator);

          yn.first_photo?.small_url ? el("img", { src: ravImg(yn.first_photo.small_url), style: "width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none", alt: "" }) : el("span", { style: "width:52px;flex:none;text-align:center;font-size:1.6rem" }, "🧶"),
          el("span", { style: "flex:1;min-width:0" }, el("b", { style: "display:block" }, [yn.yarn_company_name, yn.name].filter(Boolean).join(" ")), el("span", { class: "muted small" }, [yn.yarn_weight?.name, yn.yardage && yn.yardage + " yd", yn.grams && yn.grams + " g", yn.discontinued ? "discontinued" : null].filter(Boolean).join(" · "))),
          el("span", { class: "pill" }, "Add")));
        status.textContent = (j.paginator ? `${j.paginator.results || ""} results · page ${j.paginator.page}/${j.paginator.last_page}` : "") + " — tap a yarn to add it to your stash.";

  };
  const pagerEl = el("div", { class: "flex", style: "justify-content:center;margin-top:8px" });
  const pager = pg => { pagerEl.replaceChildren(); if (!pg || pg.last_page <= 1) return; pagerEl.append(el("button", { class: "btn small", disabled: page <= 1, onclick: () => search(page - 1) }, "‹ Prev"), el("span", { class: "muted small" }, page + " / " + pg.last_page), el("button", { class: "btn small", disabled: page >= pg.last_page, onclick: () => search(page + 1) }, "Next ›")); };

  const mine = kind === "patterns"
    ? el("div", { class: "flex", style: "flex-wrap:wrap;margin-bottom:8px" }, el("button", { class: "btn small", onclick: () => ravImportLibrary(m) }, "⬇ Import my library"), el("button", { class: "btn small", onclick: () => ravImportQueue(m) }, "⬇ Import my queue"), el("button", { class: "btn small", onclick: () => ravImportProjects(m) }, "⬇ Import my projects"))
    : el("div", { class: "flex", style: "flex-wrap:wrap;margin-bottom:8px" }, el("button", { class: "btn small", onclick: () => ravImportStash(m) }, "⬇ Import my stash"));
  const m = openModal("Ravelry", el("div", null, mine, el("div", { class: "flex" }, q, opts, el("button", { class: "btn small primary", onclick: () => search(1) }, "Search")), status, list, pagerEl), [{ label: "Close" }]);
}

async function ravImportPattern(id, modal, { silent = false } = {}) {
  const existing = data.patterns.find(p => p.ravelryId === id);
  if (existing) { if (!silent) { toast("Already imported"); modal?.close(); go("patterns", existing.id); } return existing; }
  if (!silent) toast("Importing pattern…");
  try {
    const j = await rav("patterns/" + id + ".json"); const p = j.pattern; if (!p) throw new Error("No pattern in response");
    const pat = ravPatternToApp(p);
    const photo = p.photos?.[0]?.medium_url || p.first_photo?.medium_url; const att = await ravFetchImage(photo, (pat.name || "pattern") + ".jpg"); if (att) pat.attachments.push(att);
    data.patterns.push(pat); markDirty();
    if (!silent) { modal?.close(); toast("Imported " + pat.name); go("patterns", pat.id); }
    return pat;
  } catch (e) { if (!silent) toast("Import failed: " + e.message, 4000); throw e; }
}
async function ravImportYarn(id, modal, { silent = false, extra = {} } = {}) {
  try {
    const j = await rav("yarns/" + id + ".json"); const yn = j.yarn; if (!yn) throw new Error("No yarn in response");
    const y = Object.assign(ravYarnToApp(yn), extra);
    const att = await ravFetchImage(yn.photos?.[0]?.medium_url || yn.first_photo?.medium_url, "yarn.jpg"); if (att) y.image = att.id;
    data.yarns.push(y); markDirty();
    if (!silent) { modal?.close(); go("yarns", y.id); yarnDlg(y); toast("Added — set skeins and colorway"); }
    return y;
  } catch (e) { if (!silent) toast("Import failed: " + e.message, 4000); throw e; }
}
async function ravBulk(modal, label, fetchList, importOne) {
  const st = el("div", { class: "muted small" }, "Loading " + label + "…");
  const m2 = openModal("Import " + label, st, [{ label: "Close" }]);
  try {
    const items = await fetchList(); let n = 0, skipped = 0, failed = 0;
    for (const it of items) { st.textContent = `${label}: ${n + skipped + failed + 1} / ${items.length}…`; try { const r = await importOne(it); if (r === "skip") skipped++; else n++; } catch (e) { console.warn(e); failed++; } }
    flushSave(); st.textContent = `Done — ${n} imported, ${skipped} already here${failed ? ", " + failed + " failed" : ""}.`; render();
  } catch (e) { st.textContent = "Ravelry error: " + e.message; }
}
function ravImportLibrary(modal) {
  return ravBulk(modal, "library", async () => {
    const u = await ravUsername(); const out = []; let page = 1;
    while (page < 40) { const j = await rav(`people/${u}/library/list.json`, { page_size: 100, page }); const vols = j.volumes || j.library || []; out.push(...vols); if (!j.paginator || page >= j.paginator.last_page) break; page++; }
    return out.map(v => v.pattern_id || v.pattern?.id).filter(Boolean);
  }, async id => data.patterns.some(p => p.ravelryId === id) ? "skip" : ravImportPattern(id, null, { silent: true }));
}
function ravImportQueue(modal) {
  return ravBulk(modal, "queue", async () => { const u = await ravUsername(); const j = await rav(`people/${u}/queue/list.json`, { page_size: 100 }); return (j.queued_projects || []).filter(q => q.pattern_id); },
    async q => { const pat = data.patterns.find(p => p.ravelryId === q.pattern_id) || await ravImportPattern(q.pattern_id, null, { silent: true }); if (data.projects.some(p => p.ravelryQueueId === q.id)) return "skip"; data.projects.push(newProject({ name: q.name || pat.name, patternId: pat.id, status: "planning", notes: q.notes || "", ravelryQueueId: q.id })); markDirty(); });
}
function ravImportProjects(modal) {
  const statusMap = { "In progress": "active", "Finished": "finished", "Hibernating": "hibernating", "Frogged": "frogged", "Planned": "planning" };
  return ravBulk(modal, "projects", async () => { const u = await ravUsername(); const j = await rav(`people/${u}/projects/list.json`, { page_size: 200 }); return j.projects || []; },
    async pj => {
      if (data.projects.some(p => p.ravelryId === pj.id)) return "skip";
      let pat = null; if (pj.pattern_id) { try { pat = data.patterns.find(p => p.ravelryId === pj.pattern_id) || await ravImportPattern(pj.pattern_id, null, { silent: true }); } catch {} }
      const pr = newProject({ name: pj.name || pat?.name || "Ravelry project", patternId: pat?.id || "", status: statusMap[pj.status_name] || "active", started: (pj.started || "").slice(0, 10), finished: (pj.completed || "").slice(0, 10), notes: stripHtml(pj.notes_html) || pj.notes || "", ravelryId: pj.id, updated: pj.updated_at || new Date().toISOString() });
      if (pj.first_photo?.medium_url) { const att = await ravFetchImage(pj.first_photo.medium_url, "project.jpg"); if (att) pr.attachments.push(att); }
      data.projects.push(pr); markDirty();
    });
}
function ravImportStash(modal) {
  return ravBulk(modal, "stash", async () => { const u = await ravUsername(); const j = await rav(`people/${u}/stash/list.json`, { page_size: 200 }); return j.stash || []; },
    async s => {
      if (data.yarns.some(y => y.ravelryStashId === s.id)) return "skip";
      const extra = { ravelryStashId: s.id, colorway: s.colorway_name || "", qty: s.skeins ?? s.quantity ?? 1, notes: [s.dye_lot && "Dye lot " + s.dye_lot, s.location && "Location: " + s.location, stripHtml(s.notes_html) || s.notes].filter(Boolean).join(" · ") };
      if (s.yarn?.id) { const y = await ravImportYarn(s.yarn.id, null, { silent: true, extra }); if (!y.notes && extra.notes) y.notes = extra.notes; }
      else { const y = Object.assign(newYarn(), { brand: s.yarn_company_name || "", name: s.yarn_name || s.name || "Stash yarn", weight: ravWeightToApp(s.yarn_weight?.name) }, extra); data.yarns.push(y); markDirty(); }
    });
}
